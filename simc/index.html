<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>spinning card reveal</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(15deg, #312845, #212138, #24335e);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .scene {
    width: 100vw;
    height: 100vh;
    perspective: 1500px;
    display: grid;
    place-items: center;
  }

  .card {
    width: min(50vw, 600px);
    aspect-ratio: 1.414 / 1;
    position: relative;
    transform-style: preserve-3d;
    transform-origin: center;
    cursor: pointer;
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: none;
    background: transparent;
  }

  .face img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .back {
    transform: rotateY(180deg);
  }
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">
    <div class="face front">
      <img id="frontImg" src="assets/core-front.png">
    </div>

    <div class="face back">
      <img id="backImg" src="assets/core-back.png">
    </div>
  </div>
</div>

<script src="index.js">
</script>

</body>
</html>
