<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>spinning card reveal</title>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(15deg, #312845, #212138, #24335e);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .scene {
    width: 100vw;
    height: 100vh;
    perspective: 1500px;
    display: grid;
    place-items: center;
  }

  .card {
    width: min(50vw, 600px);
    aspect-ratio: 1.414 / 1;
    position: relative;
    transform-style: preserve-3d;
    transform-origin: center;
    cursor: pointer;
  }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: none;
    background: transparent;
  }

  .face img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .back {
    transform: rotateY(180deg);
  }
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">
    <div class="face front">
      <img src="card/front.svg">
    </div>

    <div class="face back">
      <img src="card/back.svg">
    </div>
  </div>
</div>

<script>
const card = document.getElementById("card");

gsap.set(card, {
  scale: 0.01,
  rotateY: 0,
  rotateZ: 0
});

const tl = gsap.timeline({ paused: true });

// spin in
tl.to(card, {
  duration: 2.4,
  scale: 1.15,
  rotateY: 720,
  ease: "power2.out"
}, 0)

// wobble whlie spinning
.to(card, {
  rotateZ: 0.8,
  duration: 0.2,
  repeat: 7,
  yoyo: true,
  ease: "sine.inOut"
}, 0)

// slow display of front
.to(card, {
    rotateY: "+=20",
    rotateZ: "+=2",
    ease: "sine.in",
    duration: 2.0
}, 1.6)

// turn to back
.to(card, {
  rotateY: "+=160", 
  rotateZ: "-=3",
  duration: 1,   
  ease: "sine.in"
}, "flip")  

// slow display of back
.to(card, {
  rotateY: "+=20", 
  rotateZ: "-=1",
  duration: 1.4,   
  ease: "sine.out"
}) 

// spin out
.to(card, {
  duration: 1.4,
  scale: 0.01,
  rotateY: "+=720",
  ease: "power2.out"
},"flip"+1.2);

tl.play();
</script>

</body>
</html>
